<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>こころサポート｜人格適応論 簡易自己チェック</title>
<meta name="description" content="6つのタイプ傾向から、自分の強み・ストレス時の傾向・コミュニケーションのヒントを確認できる簡易自己チェックです。">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--ink:#3e3a36;--muted:#756e67;--bg:#fbf7f1;--card:#fff;--line:#e9dfd5;--main:#D67B65;--green:#4f8b6b;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink);background:
radial-gradient(circle at 12% 0%,#fff0e6 0 12%,transparent 28%),
radial-gradient(circle at 90% 6%,#edf7ef 0 11%,transparent 26%),var(--bg);}
button{font:inherit}
.app{max-width:980px;margin:auto;padding:18px 14px 60px}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-weight:800;letter-spacing:.08em;color:#547863} .logo span{color:#d47f69}
.badge{font-size:12px;background:#fff;border:1px solid var(--line);padding:7px 11px;border-radius:999px;color:var(--muted)}
.hero{background:linear-gradient(135deg,#fff,#fff8f1 55%,#edf7ef);border:1px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:0 20px 60px rgba(76,59,42,.1);padding:clamp(22px,5vw,46px);position:relative}
.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;top:-90px;background:rgba(214,123,101,.1)}
.kicker{color:#4f8b6b;font-weight:800;font-size:14px;letter-spacing:.12em}
h1{font-size:clamp(32px,7vw,58px);line-height:1.16;margin:10px 0 14px}
h1 em{font-style:normal;color:#d47762}
.lead{line-height:1.9;max-width:680px;color:#625c56}
.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:22px;align-items:center}
.mascot-stage{min-height:260px;display:grid;place-items:center;position:relative}
.mascot{width:230px;height:230px}
.float{position:absolute;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.08);border-radius:18px;padding:10px 12px;font-size:13px}
.f1{left:0;top:18px} .f2{right:0;bottom:24px}
.points{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.point{background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:12px;font-size:13px}
.cta{border:0;background:linear-gradient(135deg,#d67b65,#e7a26e);color:#fff;font-weight:800;padding:15px 26px;border-radius:999px;box-shadow:0 10px 24px rgba(214,123,101,.28);cursor:pointer}
.note{font-size:12px;color:var(--muted);line-height:1.75;margin-top:14px}
.hidden{display:none!important}
.progress-wrap{position:sticky;top:0;z-index:5;background:rgba(251,247,241,.94);backdrop-filter:blur(8px);padding:12px 0}
.progress{height:10px;background:#e9dfd5;border-radius:999px;overflow:hidden} .bar{height:100%;width:0;background:linear-gradient(90deg,#d67b65,#e5b06d);transition:.25s}
.counter{text-align:right;font-size:12px;color:var(--muted);margin-top:5px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 12px 30px rgba(0,0,0,.06)}
.qno{font-size:13px;color:#4f8b6b;font-weight:800} .question{font-size:clamp(19px,4vw,25px);font-weight:800;line-height:1.6;margin:10px 0 18px}
.options{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:15px;padding:14px;cursor:pointer;transition:.15s}
.opt:hover{transform:translateY(-1px);background:#fff9f4} .opt input{transform:scale(1.25)}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:999px;padding:13px 21px;font-weight:800;cursor:pointer}
.primary{background:#d67b65;color:#fff} .secondary{background:#eee5dc;color:#554d47}
.result-shell{display:grid;gap:16px}
.result-hero{background:linear-gradient(135deg,#fff,#f0faf4);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 14px 35px rgba(0,0,0,.07)}
.result-head{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:center}
.result-type{display:inline-flex;align-items:center;gap:10px;color:white;font-weight:900;font-size:clamp(28px,6vw,48px);padding:9px 20px;border-radius:999px;margin:8px 0}
.result-title{font-size:20px;font-weight:800;line-height:1.5}
.character-card{border-radius:22px;padding:18px;text-align:center;border:1px solid var(--line);background:#fff}
.character-card .char{font-size:72px;line-height:1}
.character-card strong{display:block;font-size:20px;margin-top:8px}
.rank{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.rank span{padding:8px 11px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:13px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px}
.panel h2{margin:0 0 14px;font-size:21px}
.insight{border-radius:18px;padding:16px;margin:12px 0;line-height:1.85}
.good{background:#eef8f1;border:1px solid #cce6d4} .stress{background:#f5effa;border:1px solid #e1d4ed}
.comm{background:#eef6ff;border:1px solid #cfe0f4} .care{background:#fff7e9;border:1px solid #f0dcb7}
.insight h3{margin:0 0 7px;font-size:17px}
.radar{width:100%;max-width:390px;display:block;margin:auto}
.score-row{display:grid;grid-template-columns:82px 1fr 36px;gap:8px;align-items:center;margin:10px 0}
.track{height:13px;background:#eee8e1;border-radius:999px;overflow:hidden} .fill{height:100%;border-radius:999px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.type-chip{text-align:center;border-radius:14px;padding:11px;font-size:12px;line-height:1.5;border:1px solid var(--line)}
.type-chip b{display:block;font-size:15px}
.pdf-note{font-size:12px;color:var(--muted);line-height:1.7}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.82);display:grid;place-items:center;z-index:99;font-weight:800}
.spinner{width:44px;height:44px;border:5px solid #eadfd5;border-top-color:#d67b65;border-radius:50%;animation:spin 1s linear infinite;margin:auto auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:720px){.hero-grid,.result-head,.grid{grid-template-columns:1fr} .mascot-stage{min-height:220px} .types{grid-template-columns:repeat(2,1fr)} .app{padding:12px 10px 40px}}
@media print{body{background:#fff} .brand,.actions,.progress-wrap,#intro,footer{display:none!important} .app{max-width:none;padding:0} .panel,.result-hero{break-inside:avoid;box-shadow:none}}

/* 横長16:9・ビジネス向け結果画面：固定キャンバスを縮小表示 */
.report-stage{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  background:#eef2f0;
  border-radius:16px;
}
#report.report169{
  position:absolute;
  left:0;
  top:0;
  width:1600px;
  height:900px;
  transform-origin:top left;
  background:#fffdfa;
  border:1px solid #dbe2de;
  padding:24px 28px 18px;
  box-shadow:none;
  display:grid;
  grid-template-rows:82px 610px 142px;
  gap:12px;
  overflow:hidden;
  font-size:18px;
}
.rtop{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:18px;
  border-bottom:3px solid #173b60;
  padding-bottom:12px;
}
.rbrand{
  font-weight:800;
  letter-spacing:.08em;
  color:#315f50;
  font-size:20px;
}
.rtitle{
  font-size:48px;
  font-weight:900;
  line-height:1;
  margin:4px 0 0;
  color:#26323c;
}
.rmeta{
  font-size:17px;
  color:#5e6971;
  white-space:nowrap;
}
.rmain{
  display:grid;
  grid-template-columns:430px 470px 1fr;
  gap:16px;
  min-height:0;
}
.rcard{
  border:2px solid #d9e1dd;
  border-radius:18px;
  padding:18px;
  background:#fff;
  overflow:hidden;
  min-width:0;
}
.typecard{
  display:grid;
  grid-template-rows:52px 112px 1fr;
  align-items:start;
  text-align:center;
  background:linear-gradient(180deg,#f5f9f7,#fff);
}
.typepill{
  display:inline-block;
  padding:9px 24px;
  border-radius:999px;
  color:#fff;
  font-size:20px;
  font-weight:800;
}
.typename{
  font-size:74px;
  font-weight:900;
  line-height:1;
  margin:10px 0 4px;
}
.typesub{
  font-size:20px;
  font-weight:800;
  line-height:1.3;
}
.charwrap{
  display:grid;
  grid-template-columns:150px 1fr;
  gap:16px;
  align-items:center;
  min-height:0;
}
.charsvg{
  width:145px;
  height:145px;
}
.speechbox{
  background:#fff;
  border:2px solid #d9e1dd;
  border-radius:16px;
  padding:16px;
  line-height:1.65;
  text-align:left;
  font-size:17px;
  max-height:260px;
  overflow:hidden;
}
.chartcard{
  display:grid;
  grid-template-rows:42px 1fr 62px;
  background:linear-gradient(180deg,#fafcfd,#fff);
}
.chartcard h3{
  margin:0;
  font-size:26px;
}
.chartcard .radar{
  width:100%;
  height:470px;
  max-width:none;
  max-height:none;
}
.rstack{
  display:grid;
  grid-template-rows:180px 180px 218px;
  gap:16px;
  min-height:0;
}
.minicard{
  border-radius:16px;
  padding:18px 20px;
  line-height:1.55;
  border:2px solid;
  overflow:hidden;
}
.strength2{background:#f5faf7;border-color:#80a88f}
.stress2{background:#f4f7fb;border-color:#8aa3c1}
.comm2{background:#fbf8f1;border-color:#bba474}
.minicard h3,.advice h3,.secondbox h3{
  margin:0 0 10px;
  font-size:24px;
}
.minicard ul{
  margin:0;
  padding-left:24px;
}
.minicard li{
  margin:5px 0;
}
.rbottom{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:16px;
  height:106px;
}
.advice,.secondbox{
  border-radius:16px;
  padding:14px 20px;
  overflow:hidden;
}
.advice{
  border:2px solid #d2b56a;
  background:#fffaf0;
}
.secondbox{
  background:#f4f8f5;
  border:2px solid #9db5a5;
}
.rfooter{
  text-align:center;
  background:#466c5e;
  color:#fff;
  border-radius:10px;
  padding:8px 12px;
  font-size:15px;
  font-weight:700;
  margin-top:8px;
}
.result-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}
@media(max-width:900px){
  .report-stage{border-radius:8px}
}
@media print{
  body{background:#fff}
  .brand,.actions,#intro,#quiz,footer,.result-actions{display:none!important}
  .app{max-width:none;padding:0}
  .report-stage{
    width:100%;
    max-width:none;
    aspect-ratio:16/9;
    overflow:visible;
    background:#fff;
  }
  #report.report169{
    transform:scale(.66)!important;
    transform-origin:top left;
  }
}

/* ===== シャープなビジネス向けトップ画面 ===== */
.sharp-hero{
  min-height:calc(100vh - 90px);
  display:grid;
  align-items:center;
  background:
    linear-gradient(135deg,rgba(7,35,70,.98),rgba(9,48,86,.96) 58%,rgba(31,93,67,.94)),
    #0b2e55;
  color:#fff;
  border-radius:0;
  overflow:hidden;
  position:relative;
}
.sharp-hero:before{
  content:"";
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to right,#000,transparent 82%);
}
.sharp-shell{
  width:min(1180px,92%);
  margin:auto;
  display:grid;
  grid-template-columns:1.02fr .98fr;
  gap:54px;
  align-items:center;
  position:relative;
  z-index:1;
  padding:56px 0;
}
.sharp-eyebrow{
  font-size:13px;
  letter-spacing:.22em;
  font-weight:700;
  color:#9cc580;
  margin-bottom:18px;
}
.sharp-title{
  margin:0;
  font-size:clamp(42px,6.1vw,78px);
  line-height:1.05;
  font-weight:800;
  letter-spacing:.01em;
}
.sharp-title span{
  display:inline-block;
  color:#a5cf82;
  position:relative;
}
.sharp-title span:after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:-6px;height:3px;
  background:linear-gradient(90deg,#a5cf82,transparent);
}
.sharp-lead{
  margin:28px 0 24px;
  max-width:640px;
  font-size:17px;
  line-height:1.9;
  color:rgba(255,255,255,.86);
}
.sharp-points{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.16);
  margin:26px 0;
}
.sharp-points>div{
  background:rgba(4,25,49,.58);
  padding:16px 18px;
}
.sharp-points strong{
  display:block;
  font-size:18px;
  color:#fff;
}
.sharp-points span{
  display:block;
  font-size:12px;
  color:rgba(255,255,255,.66);
  margin-top:4px;
}
.sharp-cta{
  border:1px solid #a5cf82;
  background:#a5cf82;
  color:#0b2e55;
  font-weight:800;
  font-size:18px;
  padding:16px 34px;
  border-radius:4px;
  cursor:pointer;
  box-shadow:none;
  transition:.2s;
}
.sharp-cta:hover{
  background:transparent;
  color:#fff;
}
.sharp-note{
  margin-top:16px;
  font-size:12px;
  color:rgba(255,255,255,.58);
  line-height:1.7;
}
.sharp-right{
  min-height:480px;
  position:relative;
  display:grid;
  place-items:center;
}
.logo-frame{
  width:min(100%,560px);
  background:#fff;
  padding:14px;
  box-shadow:0 22px 60px rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.28);
}
.logo-frame img{
  display:block;
  width:100%;
  height:auto;
}
.geometry{position:absolute;inset:0;pointer-events:none}
.hex{
  position:absolute;
  width:120px;height:104px;
  border:1px solid rgba(165,207,130,.55);
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
}
.h1{right:2%;top:7%}.h2{left:0;bottom:4%;transform:scale(.68)}
.line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,#a5cf82,transparent)}
.l1{width:70%;top:18%;left:12%;transform:rotate(-9deg)}
.l2{width:58%;bottom:15%;right:8%;transform:rotate(12deg)}
.radar-mark{
  position:absolute;
  width:140px;height:140px;
  right:5%;bottom:6%;
  border:1px solid rgba(255,255,255,.22);
  border-radius:50%;
}
.radar-mark:before,.radar-mark:after{
  content:"";position:absolute;inset:20px;border:1px solid rgba(255,255,255,.14);border-radius:50%
}
.radar-mark:after{inset:43px}
.radar-mark span{
  position:absolute;left:50%;top:50%;width:1px;height:50%;
  background:rgba(165,207,130,.42);
  transform-origin:0 0;
}
.radar-mark span:nth-child(1){transform:rotate(0deg)}
.radar-mark span:nth-child(2){transform:rotate(60deg)}
.radar-mark span:nth-child(3){transform:rotate(120deg)}
.radar-mark span:nth-child(4){transform:rotate(180deg)}
.radar-mark span:nth-child(5){transform:rotate(240deg)}
.radar-mark span:nth-child(6){transform:rotate(300deg)}
.sharp-tag{
  position:absolute;
  right:0;
  bottom:-6px;
  font-size:11px;
  letter-spacing:.16em;
  color:rgba(255,255,255,.7);
}
@media(max-width:900px){
  .sharp-shell{grid-template-columns:1fr;gap:28px;padding:38px 0}
  .sharp-right{min-height:auto}
  .sharp-points{grid-template-columns:1fr}
  .sharp-tag{position:static;margin-top:12px;text-align:right}
}

</style>
</head>
<body>
<div id="loading" class="loading hidden"><div><div class="spinner"></div>PDFを作成しています…</div></div>
<div class="app">
  <div class="brand"><div class="logo">こころ<span>サポート</span></div><div class="badge">簡易傾向チェック</div></div>

  
<section id="intro" class="sharp-hero">
  <div class="sharp-shell">
    <div class="sharp-left">
      <div class="sharp-eyebrow">KOKORO SUPPORT FUKUOKA</div>
      <h1 class="sharp-title">3分でわかる<br><span>人格適応論</span><br>簡易自己チェック</h1>
      <p class="sharp-lead">
        自分の強み、ストレス時の反応、コミュニケーションの傾向を、
        30の質問からわかりやすく可視化します。
      </p>
      <div class="sharp-points">
        <div><strong>約3分</strong><span>短時間で回答</span></div>
        <div><strong>30問</strong><span>シンプル設計</span></div>
        <div><strong>PDF対応</strong><span>結果を保存</span></div>
      </div>
      <button class="sharp-cta" onclick="startQuiz()">診断を開始する</button>
      <div class="sharp-note">
        本チェックは自己理解を目的とした簡易チェックであり、医療・心理診断ではありません。
      </div>
    </div>

const profiles={"想像型": {"title": "静かに深く考えるクリエイター", "tag": "想像力・独創性・静かな集中", "color": "#E6A33B", "soft": "#FFF5DA", "icon": "💡", "good": "落ち着いた環境では、豊かな想像力と独自の視点を発揮します。目立つよりも、裏方として丁寧に支えたり、一人で集中して考えたりする場面で力を出しやすいタイプです。", "stress": "負担が続くと、考えがまとまらず固まったり、必要なことを後回しにしたり、人との関わりを避けたくなることがあります。", "comm": "急かされると力を出しにくいため、考える時間を確保しましょう。自分の考えを短い言葉でも伝えると、周囲に理解されやすくなります。", "care": "一人で落ち着ける時間と空間を意識して確保し、考えがまとまったら小さな行動を一つ決めてみましょう。"}, "行動型": {"title": "結果を生み出すチャレンジャー", "tag": "行動力・決断力・結果志向", "color": "#5E8FD8", "soft": "#EAF2FF", "icon": "🚀", "good": "目標がはっきりしていると、決断の早さと行動力を発揮します。状況への順応力があり、周囲を巻き込みながら結果につなげることが得意です。", "stress": "負担が続くと、自分のやり方を押し通したり、間違いを認めにくくなったり、相手を急かしてしまうことがあります。", "comm": "結論を急ぎすぎず、相手の考えや気持ちを確認する時間を持ちましょう。「まず聞く、次に決める」を意識すると強みがさらに活きます。", "care": "適度な刺激や挑戦を取り入れながら、立ち止まって振り返る時間も持ちましょう。"}, "信念型": {"title": "信頼を積み重ねる守護者", "tag": "信頼・責任感・価値観", "color": "#6E9B75", "soft": "#EAF6EC", "icon": "🛡️", "good": "誠実で責任感があり、礼儀や信頼を大切にします。自分なりの価値観や基準を持ち、慎重に物事を見極めることができます。", "stress": "負担が続くと、自分の考えを強く押し通したり、相手の姿勢や意見を厳しく見たり、細かな欠点が気になりやすくなります。", "comm": "正しさだけでなく、相手が何を大切にしているかにも目を向けましょう。意見の違いを「間違い」ではなく「価値観の違い」と捉えると対話が深まります。", "care": "信頼できる人の考えに触れたり、自然の中で気持ちを切り替えたりする時間を持ちましょう。"}, "反応型": {"title": "場を明るくするムードメーカー", "tag": "明るさ・自由・遊び心", "color": "#9A78D1", "soft": "#F2ECFF", "icon": "🎈", "good": "楽しさや自由がある場面では、素直な反応と遊び心で周囲を明るくします。柔軟な発想や親しみやすさが魅力です。", "stress": "負担が続くと、不平不満が増えたり、指示されることに反発したり、好き・嫌いだけで判断しやすくなることがあります。", "comm": "最初の反応だけで決めつけず、少し間を置いて事実も確認しましょう。自分にも相手にも選択肢を残すと、関係がスムーズになります。", "care": "楽しいことや自由に選べる時間を取り入れ、気分が大きく動いたときは少し時間を置いてから決めましょう。"}, "思考型": {"title": "正確に進める分析家", "tag": "論理性・分析力・正確さ", "color": "#3E9667", "soft": "#EAF7EF", "icon": "🔍", "good": "事実や情報を整理し、計画的に進める力があります。責任感が強く、正確さや効率を大切にし、分かりやすく説明することが得意です。", "stress": "負担が続くと、完璧を求めすぎたり、仕事を抱え込みすぎたり、細部が気になって休みにくくなることがあります。", "comm": "正確さを大切にしつつ、相手が求めているのが「答え」なのか「共感」なのかを確認しましょう。説明は結論から伝えるとより届きやすくなります。", "care": "頭を使い続けた日は、意識して体を動かしたり、何もしない時間をつくったりしましょう。"}, "感情型": {"title": "人をあたためるサポーター", "tag": "共感・思いやり・調和", "color": "#E37983", "soft": "#FFF0F2", "icon": "❤", "good": "相手の気持ちに寄り添い、安心できる雰囲気をつくります。人間関係を大切にし、周囲を支える力があります。", "stress": "負担が続くと、相手に気を遣いすぎたり、自分の気持ちを後回しにしたり、周囲の反応に大きく左右されやすくなります。", "comm": "相手を大切にするのと同じように、自分の希望や限界も言葉にしましょう。「私はこう感じます」と伝えることが大切です。", "care": "人に気を配った分だけ、自分の気持ちにも目を向け、安心できる人に話す時間を持ちましょう。"}};
const choices=[["とても当てはまる",3],["やや当てはまる",2],["あまり当てはまらない",1],["当てはまらない",0]];
let idx=0;
const answers=new Array(questions.length).fill(null);

function startQuiz(){document.getElementById("intro").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");renderQuestion();}
function renderQuestion(){
 const q=questions[idx];
 document.getElementById("questionArea").innerHTML=`<div class="qcard"><div class="qno">QUESTION ${idx+1} / ${questions.length}</div><div class="question">${q.text}</div><div class="options">${choices.map(([label,val])=>`<label class="opt"><input type="radio" name="ans" value="${val}" ${answers[idx]===val?"checked":""}><span>${label}</span></label>`).join("")}</div></div>`;
 document.querySelectorAll('input[name="ans"]').forEach(el=>el.onchange=e=>{answers[idx]=Number(e.target.value);updateProgress();});
 document.getElementById("prevBtn").style.visibility=idx===0?"hidden":"visible";
 document.getElementById("nextBtn").textContent=idx===questions.length-1?"結果を見る":"次へ";
 updateProgress(); window.scrollTo({top:0,behavior:"smooth"});
}
function updateProgress(){const done=answers.filter(v=>v!==null).length;document.getElementById("bar").style.width=(done/questions.length*100)+"%";document.getElementById("counter").textContent=`回答済み ${done} / ${questions.length}`;}
function nextQuestion(){if(answers[idx]===null){alert("回答を選んでください。");return;} if(idx<questions.length-1){idx++;renderQuestion();}else showResult();}
function prevQuestion(){if(idx>0){idx--;renderQuestion();}}


function professionalCharacter(type,color){
 const badges={"想像型":"IDEA","信念型":"TRUST","行動型":"ACTION","反応型":"FLEX","思考型":"LOGIC","感情型":"CARE"};
 return `<svg class="charsvg" viewBox="0 0 140 140" role="img" aria-label="${type}の人物イラスト">
 <circle cx="70" cy="70" r="66" fill="#f5f7f6" stroke="${color}" stroke-width="2"/>
 <circle cx="70" cy="46" r="21" fill="#d8b08c"/>
 <path d="M48 45 Q70 20 92 45" fill="#4b4038"/>
 <path d="M42 113 Q46 78 70 77 Q94 78 98 113" fill="${color}" opacity=".9"/>
 <path d="M58 79 L70 91 L82 79" fill="#fff"/>
 <rect x="36" y="109" width="68" height="18" rx="9" fill="#fff" stroke="${color}"/>
 <text x="70" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="${color}">${badges[type]}</text>
 </svg>`;
}
function radar(scores){
 const order=["想像型","信念型","行動型","反応型","思考型","感情型"],cx=180,cy=170,R=112,max=15;
 const pt=(i,r)=>{const a=-Math.PI/2+Math.PI*2*i/order.length;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
 let grid="";[.25,.5,.75,1].forEach(l=>grid+=`<polygon points="${order.map((_,i)=>pt(i,R*l).join(",")).join(" ")}" fill="none" stroke="#ddd7d0"/>`);
 const axes=order.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e4ded7"/>`}).join("");
 const data=order.map((t,i)=>pt(i,R*scores[t]/max).join(",")).join(" ");
 const labels=order.map((t,i)=>{const [x,y]=pt(i,R+28),a=x<cx-5?"end":x>cx+5?"start":"middle";return `<text x="${x}" y="${y}" text-anchor="${a}" font-size="12" font-weight="700" fill="#4d4843">${profiles[t].icon} ${t}</text>`}).join("");
 return `<svg class="radar" viewBox="0 0 360 340">${grid}${axes}<polygon points="${data}" fill="rgba(62,150,103,.23)" stroke="#3E9667" stroke-width="3"/>${order.map((t,i)=>{const [x,y]=pt(i,R*scores[t]/max);return `<circle cx="${x}" cy="${y}" r="4" fill="${profiles[t].color}"/>`}).join("")}${labels}</svg>`;
}
function fitReport(){
 const stage=document.querySelector(".report-stage");
 const report=document.getElementById("report");
 if(!stage||!report)return;
 const scale=stage.clientWidth/1600;
 report.style.transform=`scale(${scale})`;
}
window.addEventListener("resize",fitReport);

function showResult(){
 const scores={"想像型":0,"行動型":0,"信念型":0,"反応型":0,"思考型":0,"感情型":0};
 questions.forEach((q,i)=>scores[q.type]+=answers[i]);
 const rank=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
 const top=rank[0][0],second=rank[1][0],third=rank[2][0],p=profiles[top];

 const summaries={
  "想像型":"静かな環境で深く考え、独自の視点や発想を生み出すタイプです。",
  "行動型":"決断と行動が早く、変化に対応しながら成果へ進むタイプです。",
  "信念型":"信頼・礼儀・価値観を大切にし、責任を持って取り組むタイプです。",
  "反応型":"自由な発想と親しみやすさで、場に活気を生み出すタイプです。",
  "思考型":"情報を整理し、計画的かつ正確に物事を進めるタイプです。",
  "感情型":"相手の気持ちに寄り添い、安心できる関係をつくるタイプです。"
 };
 const strengths={
  "想像型":["独自の視点で考えられる","静かな環境で集中できる","裏方として丁寧に支えられる"],
  "行動型":["決断が早い","変化に柔軟に対応できる","目標に向かって動ける"],
  "信念型":["誠実で責任感がある","礼儀や信頼を大切にする","価値観を持って判断できる"],
  "反応型":["場を明るくできる","柔軟な発想ができる","親しみやすく反応が素直"],
  "思考型":["情報を整理できる","計画的に進められる","正確さと効率を大切にできる"],
  "感情型":["相手の気持ちに寄り添える","安心感を与えられる","人間関係を整えられる"]
 }[top];
 const stress={
  "想像型":["考えすぎて動けなくなる","人との関わりを避けたくなる"],
  "行動型":["結論を急ぎすぎる","相手を急かしやすくなる"],
  "信念型":["相手に厳しくなりやすい","正しさにこだわりすぎる"],
  "反応型":["反発や不満が出やすい","好き嫌いで判断しやすくなる"],
  "思考型":["完璧を求めすぎる","仕事を抱え込みやすい"],
  "感情型":["気を遣いすぎる","自分の気持ちを後回しにする"]
 }[top];

 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").innerHTML=`
 <div class="report-stage">
  <div id="report" class="report169">
   <div class="rtop">
    <div>
     <div class="rbrand">こころサポート｜人格適応論 簡易自己チェック</div>
     <h1 class="rtitle">あなたの診断結果</h1>
    </div>
    <div class="rmeta">第1傾向：${top}　／　第2傾向：${second}</div>
   </div>

   <div class="rmain">
    <section class="rcard typecard">
     <div><span class="typepill" style="background:${p.color}">あなたのタイプは</span></div>
     <div>
      <div class="typename" style="color:${p.color}">${top}</div>
      <div class="typesub">${p.title}</div>
     </div>
     <div class="charwrap">
      ${professionalCharacter(top,p.color)}
      <div class="speechbox">${summaries[top]}</div>
     </div>
    </section>

    <section class="rcard chartcard">
     <h3>6タイプのバランス</h3>
     ${radar(scores)}
     <div style="font-size:15px;color:#5d6870;line-height:1.5">
      1位 ${top} ／ 2位 ${second} ／ 3位 ${third}<br>
      得点は優劣ではなく、表れやすい傾向を示します。
     </div>
    </section>

    <div class="rstack">
     <section class="minicard strength2">
      <h3>強み</h3>
      <ul>${strengths.map(x=>`<li>${x}</li>`).join("")}</ul>
     </section>
     <section class="minicard stress2">
      <h3>ストレスがたまると</h3>
      <ul>${stress.map(x=>`<li>${x}</li>`).join("")}</ul>
     </section>
     <section class="minicard comm2">
      <h3>コミュニケーションのポイント</h3>
      <div>${p.comm}</div>
     </section>
    </div>
   </div>

   <div>
    <div class="rbottom">
     <section class="advice">
      <h3>ワンポイントアドバイス</h3>
      <div>${p.care}</div>
     </section>
     <section class="secondbox">
      <h3>第2傾向：${second}</h3>
      <div>${profiles[second].title}の特徴も持っています。2つの傾向の組み合わせが、あなた独自の強みになります。</div>
     </section>
    </div>
    <div class="rfooter">この結果は自己理解のための参考情報です。タイプを決めつけるものではありません。</div>
   </div>
  </div>
 </div>
 <div class="result-actions">
  <button class="btn secondary" onclick="restart()">もう一度行う</button>
  <button class="btn primary" onclick="downloadPDF()">PDF保存</button>
  <button class="btn primary" onclick="window.print()">印刷・PPT貼付用</button>
 </div>`;
 document.getElementById("result").classList.remove("hidden");
 requestAnimationFrame(fitReport);
 window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){answers.fill(null);idx=0;document.getElementById("result").classList.add("hidden");document.getElementById("intro").classList.remove("hidden");}
async function downloadPDF(){
 const loading=document.getElementById("loading");loading.classList.remove("hidden");
 try{
  if(!window.html2canvas||!window.jspdf)throw new Error("PDFライブラリを読み込めませんでした");
  const el=document.getElementById("report");
  const canvas=await html2canvas(el,{scale:1.8,useCORS:true,backgroundColor:"#fbf7f1"});
  const img=canvas.toDataURL("image/jpeg",.92);
  const {jsPDF}=window.jspdf; const pdf=new jsPDF("p","mm","a4");
  const pw=210,ph=297,margin=8,iw=pw-margin*2,ih=canvas.height*iw/canvas.width;
  let y=margin,remaining=ih;
  pdf.addImage(img,"JPEG",margin,y,iw,ih);
  remaining-=ph-margin*2;
  while(remaining>0){pdf.addPage();y=margin-(ih-remaining);pdf.addImage(img,"JPEG",margin,y,iw,ih);remaining-=ph-margin*2;}
  pdf.save("人格適応論_簡易自己チェック結果.pdf");
 }catch(e){alert("PDF作成に失敗しました。ブラウザの印刷機能から「PDFに保存」をお試しください。");window.print();}
 finally{loading.classList.add("hidden");}
}
